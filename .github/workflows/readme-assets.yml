name: generate readme assets

on:
  schedule:
    - cron: "0 0 * * *"   # diario a medianoche UTC
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # ---------- 1) serpiente de contribuciones ----------
      - name: generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # ---------- 2) space shooter ----------
      # Se usa el CLI de PyPI en vez de czl9707/gh-space-shooter@v2 porque
      # esa action commitea el GIF en la rama actual (main) y aquí solo
      # queremos el archivo en dist/ para publicarlo en la rama output.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: install gh-space-shooter
        run: |
          python -m pip install --upgrade pip
          pip install gh-space-shooter

      - name: generate space shooter gif
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          mkdir -p dist
          gh-space-shooter "$OWNER" \
            --output dist/game.gif \
            --strategy random \
            --fps 40

      - name: verify generated files
        run: |
          test -s dist/game.gif
          test -s dist/github-contribution-grid-snake.svg
          test -s dist/github-contribution-grid-snake-dark.svg
          ls -lh dist

      # ---------- 3) publicar dist/ en la rama output ----------
      - name: push dist to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: false      # la rama es solo artefactos, sin historial
          jekyll: false            # crea .nojekyll
          commit_message: "chore: update readme assets"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
